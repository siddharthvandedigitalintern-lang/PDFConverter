<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Ninja - PDF Auto-Redesigner</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00875F;
      --primary-light: #00D9A0;
      --bg: #0B0F19;
      --card-bg: rgba(20, 26, 45, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 135, 95, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 217, 160, 0.1) 0%, transparent 40%);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 580px;
      padding: 2rem;
      z-index: 10;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.5rem;
      text-align: center;
      animation: fadeInDown 0.8s ease;
    }

    .brand img {
      width: 180px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 12px rgba(0, 217, 160, 0.2));
    }

    .brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFF, var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 400px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.8s ease;
    }

    .dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      background: rgba(255, 255, 255, 0.02);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary-light);
      background: rgba(0, 217, 160, 0.04);
      box-shadow: 0 0 20px rgba(0, 217, 160, 0.1);
    }

    .dropzone-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .dropzone:hover .dropzone-icon {
      transform: translateY(-5px);
    }

    .dropzone-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .dropzone-sub {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .file-input {
      display: none;
    }

    .file-info {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: none;
    }

    .file-info.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .file-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .remove-file {
      cursor: pointer;
      color: #EF4444;
      font-weight: bold;
      font-size: 1.2rem;
      transition: opacity 0.2s;
    }

    .remove-file:hover {
      opacity: 0.8;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: none;
      color: white;
      padding: 1rem;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.3s;
      box-shadow: 0 4px 14px rgba(0, 135, 95, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 217, 160, 0.6);
      filter: brightness(1.1);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      background: #374151;
      color: #9CA3AF;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .loading-container {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 1.5rem;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 217, 160, 0.1);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 1rem;
    }

    .loading-text {
      font-size: 0.95rem;
      color: var(--primary-light);
      font-weight: 500;
    }

    .error-msg {
      margin-top: 1rem;
      color: #EF4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    footer {
      margin-top: auto;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">
      <img src="static/assets/logo_trans.png" alt="Notes Ninja Logo">
      <h1>Auto-Redesigner</h1>
      <p>Upload educational PDFs and get beautifully structured, custom-designed notes instantly.</p>
    </div>

    <div class="card">
      <form id="upload-form" action="/format" method="POST" enctype="multipart/form-data">
        <div class="dropzone" id="dropzone">
          <span class="dropzone-icon">📄</span>
          <div class="dropzone-text">Drag & drop your PDF here</div>
          <div class="dropzone-sub">or click to browse from device</div>
          <input type="file" name="pdf" id="file-input" class="file-input" accept=".pdf">
        </div>

        <div class="file-info" id="file-info">
          <span class="file-name" id="file-name">filename.pdf</span>
          <span class="remove-file" id="remove-file">&times;</span>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <button type="submit" class="btn" id="submit-btn" disabled>
          <span>Redesign PDF</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <div class="loading-container" id="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loading-text">Redesigning layout...</div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 Notes Ninja. Powered by Gemini & WeasyPrint.
  </footer>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const fileInfo = document.getElementById('file-info');
    const fileName = document.getElementById('file-name');
    const removeFile = document.getElementById('remove-file');
    const submitBtn = document.getElementById('submit-btn');
    const form = document.getElementById('upload-form');
    const loadingContainer = document.getElementById('loading-container');
    const errorMsg = document.getElementById('error-msg');

    // Click to browse
    dropzone.addEventListener('click', () => fileInput.click());

    // File input change
    fileInput.addEventListener('change', handleFileSelect);

    // Drag and drop events
    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      }, false);
    });

    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length) {
        fileInput.files = files;
        handleFileSelect();
      }
    });

    function handleFileSelect() {
      const file = fileInput.files[0];
      if (file) {
        if (file.type !== 'application/pdf' && !file.name.endsWith('.pdf')) {
          showError('Only PDF files are supported.');
          clearFile();
          return;
        }
        hideError();
        fileName.textContent = file.name;
        fileInfo.classList.add('active');
        submitBtn.disabled = false;
        dropzone.style.display = 'none';
      }
    }

    function clearFile() {
      fileInput.value = '';
      fileInfo.classList.remove('active');
      submitBtn.disabled = true;
      dropzone.style.display = 'block';
    }

    removeFile.addEventListener('click', (e) => {
      e.stopPropagation();
      clearFile();
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const file = fileInput.files[0];
      if (!file) return;

      submitBtn.style.display = 'none';
      fileInfo.style.display = 'none';
      loadingContainer.style.display = 'flex';
      hideError();

      const formData = new FormData();
      formData.append('pdf', file);

      try {
        const response = await fetch('/format', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          let errMsg = 'Server error during redesign.';
          const contentType = response.headers.get('content-type');
          if (contentType && contentType.includes('application/json')) {
            try {
              const data = await response.json();
              errMsg = data.error || errMsg;
            } catch (_) {}
          } else {
            const text = await response.text();
            if (text.length < 500) {
              errMsg = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim() || `Error (${response.status})`;
            } else {
              errMsg = `Server error (${response.status}: ${response.statusText})`;
            }
          }
          throw new Error(errMsg);
        }

        const data = await response.json();
        const jobId = data.job_id;
        await pollStatus(jobId);
      } catch (err) {
        showError(err.message);
        submitBtn.style.display = 'flex';
        fileInfo.style.display = 'flex';
        loadingContainer.style.display = 'none';
      }
    });

    async function pollStatus(jobId) {
      const loadingText = document.getElementById('loading-text');
      loadingText.textContent = 'Redesigning PDF layout (this may take up to 2 mins for 25+ page PDFs)...';
      
      while (true) {
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        try {
          const response = await fetch(`/status/${jobId}`);
          if (!response.ok) {
            throw new Error(`Failed to check job status (${response.status})`);
          }
          
          const data = await response.json();
          if (data.status === 'completed') {
            loadingText.textContent = 'Downloading redesigned PDF...';
            window.location.href = `/download/${jobId}`;
            
            setTimeout(() => {
              submitBtn.style.display = 'flex';
              fileInfo.style.display = 'flex';
              loadingContainer.style.display = 'none';
              loadingText.textContent = 'Redesigning layout...';
            }, 3000);
            break;
          } else if (data.status === 'failed') {
            throw new Error(data.error || 'Layout redesign failed on the server.');
          }
        } catch (err) {
          showError(err.message);
          submitBtn.style.display = 'flex';
          fileInfo.style.display = 'flex';
          loadingContainer.style.display = 'none';
          loadingText.textContent = 'Redesigning layout...';
          break;
        }
      }
    }
  </script>
</body>
</html>
